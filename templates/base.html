<!DOCTYPE html>
<html>
  <head>
    <title>{% block title %}How's Dan?{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='danspotting.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='food.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/htmx.min.js"></script>
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <div class="layout">
      <nav class="sidebar">
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="nav-links" id="nav-links">
          <a href="/"
             hx-get="/partial/"
             hx-target="#content"
             hx-push-url="/"
             class="{{ 'active' if request.path == '/' }}">Home</a>
          <a href="/danspotting"
             hx-get="/partial/danspotting"
             hx-target="#content"
             hx-push-url="/danspotting"
             class="{{ 'active' if request.path == '/danspotting' }}">Danspotting</a>
          <a href="/food"
             hx-get="/partial/food"
             hx-target="#content"
             hx-push-url="/food"
             class="{{ 'active' if request.path == '/food' }}">Food</a>
        </div>
      </nav>
      <main class="main" id="content">
        {% block content %}{% endblock %}
      </main>
    </div>

    <script>
      if (!window._baseInitialized) {
        window._baseInitialized = true;

        const hamburger = document.getElementById("hamburger");
        const navLinks = document.getElementById("nav-links");

        hamburger.addEventListener("click", function() {
          navLinks.classList.toggle("open");
          hamburger.classList.toggle("active");
        });

        document.querySelectorAll(".nav-links a").forEach(link => {
          link.addEventListener("click", function(e) {
            const href = this.getAttribute("href");
            if (!href || href === "#" || href.startsWith("http")) return;
            document.querySelectorAll(".nav-links a").forEach(a => a.classList.remove("active"));
            this.classList.add("active");
            navLinks.classList.remove("open");
            hamburger.classList.remove("active");
          });
        });

        document.addEventListener("htmx:afterSwap", function() {
          const main = document.querySelector(".main");
          main.style.animation = "none";
          main.offsetHeight;
          main.style.animation = "fadeIn 0.3s ease";
        });
      }
    </script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
